services:
  - type: web
    name: smart-agriculture-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker -t 300 --graceful-timeout 300 --bind 0.0.0.0:$PORT main:app
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: HF_REPO_ID
        value: DhruvKatharotiya/smart-agriculture-models
      - key: MODEL_BASE_URL
        sync: false
